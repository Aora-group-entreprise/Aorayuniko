name: Transfer exact Yuniko frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  transfer:
    if: ${{ !contains(github.event.head_commit.message, '[yuniko-transfer-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aorayuniko
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Yuniko frontend
        run: |
          git clone --depth 1 https://github.com/Aora-group-entreprise/Yuniko.git /tmp/yuniko
          rm -rf src public index.html package.json components.json tsconfig.json vite.config.ts
          cp -R /tmp/yuniko/artifacts/yuniko/src ./src
          cp -R /tmp/yuniko/artifacts/yuniko/public ./public
          cp /tmp/yuniko/artifacts/yuniko/index.html ./index.html
          cp /tmp/yuniko/artifacts/yuniko/package.json ./package.json
          cp /tmp/yuniko/artifacts/yuniko/components.json ./components.json
          cp /tmp/yuniko/artifacts/yuniko/tsconfig.json ./tsconfig.json
          cp /tmp/yuniko/artifacts/yuniko/vite.config.ts ./vite.config.ts
          rm -f .github/workflows/transfer-exact-yuniko.yml

      - name: Commit exact transfer
        run: |
          git config user.name "Aora-group-entreprise"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Transfer exact Yuniko frontend [yuniko-transfer-done]"
          git push origin main
